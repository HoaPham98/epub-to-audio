<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Offline On-Device and Direct SSE Audio Reader for Vietnamese EPUBs">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EPUB to Audio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EPUB to Audio - VieNeu-TTS</title>
  <link rel="manifest" href="manifest.json">

  <!-- WebAudioEngine must be defined before Flutter scripts execute -->
  <script>
    class WebAudioEngine {
      constructor() {
        this.ctx = null;
        this.gainNode = null;
        this.nextStartTime = 0;
        this.sources = [];
        this.isPlaying = false;
        this.sampleRate = 48000;
      }

      ensureContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
          this.gainNode = this.ctx.createGain();
          this.gainNode.connect(this.ctx.destination);
          console.log('[WebAudioEngine] AudioContext created at rate:', this.ctx.sampleRate, 'state:', this.ctx.state);
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().then(() => {
            console.log('[WebAudioEngine] AudioContext resumed, state:', this.ctx.state);
          });
        }
      }

      queuePCMChunk(pcmBytes, sampleRate) {
        if (!pcmBytes || pcmBytes.length < 2) return;
        this.ensureContext();
        const rate = sampleRate || this.sampleRate || 48000;
        this.sampleRate = rate;

        const byteLen = pcmBytes.length - (pcmBytes.length % 2);
        let int16;
        try {
          if (pcmBytes.byteOffset % 2 === 0) {
            int16 = new Int16Array(pcmBytes.buffer, pcmBytes.byteOffset, byteLen / 2);
          } else {
            const copy = new Uint8Array(byteLen);
            copy.set(pcmBytes.subarray(0, byteLen));
            int16 = new Int16Array(copy.buffer, 0, byteLen / 2);
          }
        } catch (e) {
          const copy = new Uint8Array(byteLen);
          copy.set(pcmBytes.subarray(0, byteLen));
          int16 = new Int16Array(copy.buffer, 0, byteLen / 2);
        }

        const float32 = new Float32Array(int16.length);
        for (let i = 0; i < int16.length; i++) {
          float32[i] = int16[i] / 32768.0;
        }

        const buffer = this.ctx.createBuffer(1, float32.length, rate);
        buffer.getChannelData(0).set(float32);

        const source = this.ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(this.gainNode);

        const now = this.ctx.currentTime;
        if (this.nextStartTime < now) {
          this.nextStartTime = now + 0.03;
        }

        source.start(this.nextStartTime);
        this.nextStartTime += buffer.duration;
        this.sources.push(source);
        this.isPlaying = true;
        console.log('[WebAudioEngine] Queued chunk: duration=' + buffer.duration.toFixed(2) + 's, nextStart=' + this.nextStartTime.toFixed(2) + 's, activeSources=' + this.sources.length);

        source.onended = () => {
          const idx = this.sources.indexOf(source);
          if (idx !== -1) this.sources.splice(idx, 1);
          if (this.sources.length === 0 && this.ctx.currentTime >= this.nextStartTime) {
            this.isPlaying = false;
            console.log('[WebAudioEngine] All queued audio ended');
            if (typeof window._onWebAudioEnded === 'function') {
              try { window._onWebAudioEnded(); } catch (e) { console.error(e); }
            }
          }
        };
      }

      play() {
        this.ensureContext();
        this.isPlaying = true;
        console.log('[WebAudioEngine] Play called, ctxState:', this.ctx?.state);
      }

      pause() {
        if (this.ctx) {
          this.ctx.suspend();
        }
        this.isPlaying = false;
        console.log('[WebAudioEngine] Pause called');
      }

      stop() {
        for (const src of this.sources) {
          try { src.stop(); } catch (e) {}
        }
        this.sources = [];
        this.nextStartTime = 0;
        this.isPlaying = false;
        console.log('[WebAudioEngine] Stop called');
      }

      setVolume(val) {
        if (this.gainNode && this.ctx) {
          this.gainNode.gain.setValueAtTime(val, this.ctx.currentTime);
        }
      }
    }

    window._webAudioEngine = new WebAudioEngine();
    window._registerWebAudioEndedCallback = function(fn) {
      window._onWebAudioEnded = fn;
    };

    // Auto-resume AudioContext on first user interaction anywhere
    const unlockAudio = () => {
      if (window._webAudioEngine) {
        window._webAudioEngine.ensureContext();
      }
    };
    window.addEventListener('pointerdown', unlockAudio, { passive: true });
    window.addEventListener('click', unlockAudio, { passive: true });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
